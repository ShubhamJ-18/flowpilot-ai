version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flowpilot_dev}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowpilot-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  ai-service:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: flowpilot-ai
    restart: unless-stopped
    environment:
      - PORT=8001
      - AI_PROVIDER=${AI_PROVIDER:-mock}
      - AI_MODEL=${AI_MODEL:-mock-model-v1}
      - AI_API_KEY=${AI_API_KEY:-mock-dev-key}
    ports:
      - '8001:8001'

  api:
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile
    container_name: flowpilot-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=4001
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/flowpilot_dev?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-service:8001
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - WEB_ORIGIN=http://localhost:3000
    ports:
      - '4001:4001'

  web:
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
    container_name: flowpilot-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:4001/api/v1
      - NEXT_PUBLIC_AI_URL=http://localhost:8001/api/v1
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
